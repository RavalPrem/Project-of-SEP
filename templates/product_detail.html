<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ product.name }} | TechMart</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0b1629] text-white min-h-screen">

  <div class="max-w-4xl mx-auto py-10 px-4">
    <a href="/" class="text-sm text-blue-400 hover:underline">&larr; Back to Home</a>

    <div class="mt-6 grid gap-8 md:grid-cols-2">
      <div class="bg-[#101f3a] rounded-xl p-4 flex items-center justify-center">
        {% if product.image %}
          <img 
            src="{{ product.image }}" 
            alt="{{ product.name }}" 
            class="max-h-80 object-contain"
          />
        {% else %}
          <div class="text-gray-400">No image available</div>
        {% endif %}
      </div>

      <div>
        <h1 class="text-3xl font-bold mb-4">{{ product.name }}</h1>
        <p class="text-gray-300 mb-4">
          {{ product.description }}
        </p>
        <p class="text-2xl font-bold mb-6">
          ₹ {{ '%.2f'|format(product.price) }}
        </p>

        <div class="flex gap-4">
          <a
            href="/add_to_cart/{{ product.id }}"
            class="inline-block bg-blue-600 hover:bg-blue-700 text-sm font-semibold px-6 py-3 rounded-lg"
          >
            Add to Cart
          </a>
          <a
            href="/cart"
            class="inline-block bg-gray-700 hover:bg-gray-800 text-sm font-semibold px-6 py-3 rounded-lg"
          >
            Go to Cart
          </a>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
