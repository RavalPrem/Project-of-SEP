<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | TechMart</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-[#0b1629] text-white min-h-screen flex items-center justify-center">

  <div class="w-full max-w-md bg-[#101f3a] rounded-xl p-8 shadow-lg">
    <h2 class="text-2xl font-bold text-center mb-6">Login to TechMart</h2>

    {% if error %}
      <div class="mb-4 text-red-400 text-sm text-center">
        {{ error }}
      </div>
    {% endif %}

    <form method="POST">
      <input type="hidden" name="next" value="{{ next or '' }}">
      <div class="mb-4">
        <label class="block mb-1 text-gray-300">Username</label>
        <input
          type="text"
          name="username"
          required
          class="w-full px-4 py-2 rounded-lg bg-[#232f48] outline-none focus:ring-2 focus:ring-blue-600"
        />
      </div>

      <div class="mb-6">
        <label class="block mb-1 text-gray-300">Password</label>
        <input
          type="password"
          name="password"
          required
          class="w-full px-4 py-2 rounded-lg bg-[#232f48] outline-none focus:ring-2 focus:ring-blue-600"
        />
      </div>

      <button
        type="submit"
        class="w-full bg-blue-600 hover:bg-blue-700 py-2 rounded-lg font-semibold"
      >
        Login
      </button>
    </form>

    <p class="text-center text-sm text-gray-400 mt-4">
      Don’t have an account?
      <a 
        href="/register{% if next %}?next={{ next }}{% endif %}" 
        class="text-blue-400 hover:underline"
      >
        Sign up
      </a>
    </p>
  </div>

</body>
</html>
